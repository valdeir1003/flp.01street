<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração | flp.01 Street</title><style>body{background:#101010;color:#eee;font:16px system-ui;margin:0}main{max-width:1000px;margin:auto;padding:28px}h1{color:#e8c466}section,form{background:#1c1c1c;padding:24px;border:1px solid #444;border-radius:12px;margin:20px 0}label{display:block;margin:14px 0}input,textarea,select,button{font:inherit;padding:12px;border-radius:6px;box-sizing:border-box}input:not([type=checkbox]),textarea,select{display:block;width:100%;background:#111;color:white;border:1px solid #666;margin-top:6px}button{background:#e8c466;border:0;cursor:pointer;margin:6px}button:disabled{opacity:.5;cursor:wait}a{color:#e8c466}.row{display:flex;gap:16px;align-items:center;border-bottom:1px solid #444;padding:16px 0;flex-wrap:wrap}.row img{width:70px;height:85px;object-fit:cover}.row span{flex:1;min-width:160px}#status{white-space:pre-wrap;color:#e8c466}#preview{max-width:180px;max-height:180px}[hidden]{display:none!important}</style><main><a href="index.html">← Voltar à loja</a><h1>Painel administrativo</h1><p id="status" role="status" aria-live="polite"></p><form id="login"><h2>Acessar minha loja</h2><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="senha" type="password" autocomplete="current-password" required></label><button>Entrar</button></form><div id="painel" hidden><button id="sair">Sair</button><button id="novo">Nova roupa</button><button id="importar">Importar as 21 roupas atuais</button><form id="produto"><h2 id="titulo">Nova roupa</h2><input id="id" type="hidden"><label>Nome<input id="nome" required maxlength="150"></label><label>Descrição<textarea id="descricao" maxlength="2000"></textarea></label><label>Preço (R$)<input id="preco" type="number" min="0" max="99999999.99" step="0.01" required></label><label>Categoria<select id="categoria"><option value="camiseta">Camiseta / Polo</option><option value="conjunto">Conjunto</option><option value="short">Short</option></select></label><label>Tamanhos<input id="tamanhos" placeholder="P, M, G, GG" maxlength="150"></label><label>Etiqueta<input id="tag" placeholder="Novo, Promoção…" maxlength="80"></label><label>Foto (JPG, PNG ou WebP; até 5 MB)<input id="foto" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="preview" alt="Prévia da roupa" hidden><label><input id="ativo" type="checkbox" checked> Mostrar no catálogo</label><label><input id="esgotado" type="checkbox"> Esgotado</label><button id="salvar">Salvar roupa</button><button type="button" id="cancelar">Limpar</button></form><section><h2>Minhas roupas</h2><div id="lista"></div></section></div></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></html>
